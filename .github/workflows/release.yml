name: Release

on:
  pull_request:
    branches:
      - master
    types:
      - closed
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag for a Maven Central retry; for GitHub Release-only failures, re-run failed jobs instead
        required: true
        type: string
      retry_maven_central:
        description: Confirm that a new Maven Central upload is needed
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Determine release version
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_required: ${{ steps.release.outputs.release_required }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve release version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          RETRY_MAVEN_CENTRAL: ${{ inputs.retry_maven_central }}
        run: |
          set -euo pipefail

          version="$(mvn --batch-mode --no-transfer-progress --quiet \
            -Dstyle.color=never \
            -Dexpression=project.version \
            -DforceStdout \
            help:evaluate)"
          version="${version//$'\r'/}"

          if [[ -z "$version" ]]; then
            echo "::error::Unable to resolve the Maven project version."
            exit 1
          fi

          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "::error::Snapshot version '$version' cannot be released."
            exit 1
          fi

          tag="v${version}"
          release_sha="$(git rev-parse HEAD)"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_RELEASE_TAG" != "$tag" ]]; then
            echo "::error::Requested tag $REQUESTED_RELEASE_TAG does not match project version $version."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$RETRY_MAVEN_CENTRAL" != true ]]; then
            echo "::error::Confirm that a new Central upload is needed. For GitHub-only failures, re-run failed jobs instead."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

          create_tag=true
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_sha" != "$release_sha" ]]; then
              echo "::error::Tag $tag already points to $tag_sha instead of $release_sha. Bump the project version before releasing a different commit."
              exit 1
            fi

            create_tag=false
          fi
          encoded_tag="$(jq -rn --arg value "$tag" '$value | @uri')"
          response_file="$RUNNER_TEMP/github-release.json"
          if ! http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$encoded_tag")"; then
            echo "::error::Unable to check whether GitHub Release $tag exists."
            exit 1
          fi

          case "$http_status" in
            200)
              if [[ "$create_tag" == true ]]; then
                echo "::error::GitHub Release $tag exists, but its tag was not found in the checkout."
                exit 1
              fi
              if ! jq -e '.draft == false' "$response_file" >/dev/null; then
                echo "::error::GitHub Release $tag is still a draft; inspect it before retrying."
                exit 1
              fi
              for module in core server client; do
                for classifier in '' -sources -javadoc; do
                  asset="nexalithic-$module-$version$classifier.jar"
                  if ! jq -e --arg name "$asset" '.assets | any(.name == $name and .size > 0)' "$response_file" >/dev/null; then
                    echo "::error::GitHub Release $tag is missing $asset; repair its assets before retrying."
                    exit 1
                  fi
                done
              done
              echo "release_required=false" >> "$GITHUB_OUTPUT"
              echo "::notice::GitHub Release $tag is complete and points to $release_sha."
              ;;
            404)
              echo "release_required=true" >> "$GITHUB_OUTPUT"
              if [[ "$create_tag" == false ]]; then
                echo "::notice::Reusing existing tag $tag at $release_sha."
              fi
              ;;
            *)
              echo "::error::GitHub Release lookup for $tag returned HTTP $http_status."
              exit 1
              ;;
          esac

  publish-maven-central:
    name: Publish Maven Central bundle (upload and validate)
    needs: prepare
    if: needs.prepare.outputs.release_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: maven-central
    permissions:
      contents: read

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Set up Java 21 and Maven Central credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN

      - name: Use Maven 3.9.16
        shell: bash
        run: |
          set -euo pipefail

          version=3.9.16
          archive="$RUNNER_TEMP/apache-maven-$version-bin.tar.gz"
          curl -fsSLo "$archive" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$version/apache-maven-$version-bin.tar.gz"
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $archive" | sha512sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$version/bin" >> "$GITHUB_PATH"

      - name: Verify Maven version
        shell: bash
        run: |
          set -euo pipefail
          mvn --version
          mvn --version | grep -q 'Apache Maven 3.9.16'

      - name: Validate release secrets
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_KEY_FINGERPRINT: ${{ vars.MAVEN_GPG_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail

          missing=0
          for name in \
            MAVEN_CENTRAL_USERNAME \
            MAVEN_CENTRAL_TOKEN \
            MAVEN_GPG_KEY \
            MAVEN_GPG_PASSPHRASE \
            MAVEN_GPG_KEY_FINGERPRINT
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required maven-central environment value: $name"
              missing=1
            fi
          done

          exit "$missing"

      - name: Sign, upload, and validate artifacts on Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_KEY_FINGERPRINT: ${{ vars.MAVEN_GPG_KEY_FINGERPRINT }}
        run: mvn --batch-mode --no-transfer-progress -Prelease deploy

      - name: Package validated release artifacts
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          artifacts=(
            "NexalithicCore/target/nexalithic-core-${VERSION}.jar"
            "NexalithicCore/target/nexalithic-core-${VERSION}-sources.jar"
            "NexalithicCore/target/nexalithic-core-${VERSION}-javadoc.jar"
            "NexalithicServer/target/nexalithic-server-${VERSION}.jar"
            "NexalithicServer/target/nexalithic-server-${VERSION}-sources.jar"
            "NexalithicServer/target/nexalithic-server-${VERSION}-javadoc.jar"
            "NexalithicClient/target/nexalithic-client-${VERSION}.jar"
            "NexalithicClient/target/nexalithic-client-${VERSION}-sources.jar"
            "NexalithicClient/target/nexalithic-client-${VERSION}-javadoc.jar"
          )

          for artifact in "${artifacts[@]}"; do
            if [[ ! -f "$artifact" ]]; then
              echo "::error::Missing release artifact: $artifact"
              exit 1
            fi
          done

          tar -czf release-assets.tar.gz "${artifacts[@]}"

      - name: Preserve artifacts for GitHub Release retries
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          path: release-assets.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-github-release:
    name: Publish GitHub Release
    needs: [prepare, publish-maven-central]
    if: needs.prepare.outputs.release_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: maven-central
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Restore validated release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          path: .

      - name: Extract release artifacts
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf release-assets.tar.gz

      - name: Ensure release tag
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail

          remote_refs="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          remote_sha="$(awk -v ref="refs/tags/$TAG^{}" '$2 == ref { print $1 }' <<< "$remote_refs")"
          if [[ -z "$remote_sha" ]]; then
            remote_sha="$(awk -v ref="refs/tags/$TAG" '$2 == ref { print $1 }' <<< "$remote_refs")"
          fi

          if [[ -n "$remote_sha" ]]; then
            if [[ "$remote_sha" != "$RELEASE_SHA" ]]; then
              echo "::error::Remote tag $TAG points to $remote_sha instead of $RELEASE_SHA."
              exit 1
            fi
            echo "::notice::Reusing existing tag $TAG at $RELEASE_SHA."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Nexalithic $VERSION"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          artifacts=(
            "NexalithicCore/target/nexalithic-core-${VERSION}.jar"
            "NexalithicCore/target/nexalithic-core-${VERSION}-sources.jar"
            "NexalithicCore/target/nexalithic-core-${VERSION}-javadoc.jar"
            "NexalithicServer/target/nexalithic-server-${VERSION}.jar"
            "NexalithicServer/target/nexalithic-server-${VERSION}-sources.jar"
            "NexalithicServer/target/nexalithic-server-${VERSION}-javadoc.jar"
            "NexalithicClient/target/nexalithic-client-${VERSION}.jar"
            "NexalithicClient/target/nexalithic-client-${VERSION}-sources.jar"
            "NexalithicClient/target/nexalithic-client-${VERSION}-javadoc.jar"
          )

          for artifact in "${artifacts[@]}"; do
            if [[ ! -f "$artifact" ]]; then
              echo "::error::Missing release artifact: $artifact"
              exit 1
            fi
          done

          encoded_tag="$(jq -rn --arg value "$TAG" '$value | @uri')"
          response_file="$RUNNER_TEMP/github-release.json"
          if ! http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$encoded_tag")"; then
            echo "::error::Unable to check whether GitHub Release $TAG exists."
            exit 1
          fi

          case "$http_status" in
            200)
              if ! jq -e '.draft == false' "$response_file" >/dev/null; then
                echo "::error::GitHub Release $TAG is still a draft; inspect it before retrying."
                exit 1
              fi
              for artifact in "${artifacts[@]}"; do
                asset="${artifact##*/}"
                if ! jq -e --arg name "$asset" '.assets | any(.name == $name and .size > 0)' "$response_file" >/dev/null; then
                  echo "::error::GitHub Release $TAG is missing $asset; repair its assets before retrying."
                  exit 1
                fi
              done
              echo "::notice::GitHub Release $TAG is already complete."
              exit 0
              ;;
            404)
              ;;
            *)
              echo "::error::GitHub Release lookup for $TAG returned HTTP $http_status."
              exit 1
              ;;
          esac

          gh release create "$TAG" \
            "${artifacts[@]}" \
            --verify-tag \
            --title "Nexalithic $VERSION" \
            --generate-notes \
            --fail-on-no-commits

      - name: Write release summary
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "### Release prepared"
            echo
            echo "- Maven version: \`$VERSION\`"
            echo "- Git tag: \`$TAG\`"
            echo "- Maven Central: uploaded and validated; manual publishing is required"
            echo "- GitHub Release: published with binary, sources, and Javadoc JARs"
          } >> "$GITHUB_STEP_SUMMARY"
